name: Overland AI
description: >-
  Overland AI is a Seattle- and Washington, DC-based defense technology company
  building autonomous ground vehicle systems for military and national-security
  applications. Its product line spans ULTRA (a fully autonomous tactical
  vehicle with modular payloads), OverDrive (an off-road autonomy stack for
  tactical maneuver in GPS- and comms-denied environments), OverWatch (a
  command-and-control platform for single-operator control of multiple ground
  vehicles, which the company describes as offering an open API for integration
  with existing C2 systems), and SPARK (modular hardware that adds autonomous
  mobility to existing platforms). Overland AI is a portfolio company of 8VC.
  The company publishes no public developer portal, API reference, or OpenAPI
  specification; its "open API" is referenced only in marketing material and
  integration is handled through direct contact.
